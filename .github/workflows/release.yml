name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify package data is included in wheel
        run: |
          wheel=$(ls dist/*.whl)
          python -m zipfile -l "$wheel" | grep -q "smoke_bench/tui/styles.tcss" || {
            echo "ERROR: styles.tcss missing from wheel" >&2; exit 1
          }
          count=$(python -m zipfile -l "$wheel" | grep -c "smoke_bench/benchmarks/datasets/.*\.jsonl")
          echo "Found $count dataset files in wheel"
          [ "$count" -ge 1 ] || { echo "ERROR: datasets missing from wheel" >&2; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          section=$(awk -v v="## [$version]" '
            index($0, v) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -n "$section" ]; then
            printf '%s' "$section" > notes.md
          else
            echo "No CHANGELOG.md section found for [$version]; using generated notes" >&2
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: notes.md
          VERSION: ${{ github.ref_name }}
        run: |
          args=(--title "$VERSION")
          if [ -f "$NOTES_FILE" ]; then
            args+=(--notes-file "$NOTES_FILE")
          else
            args+=(--generate-notes)
          fi
          gh release create "$VERSION" dist/* "${args[@]}"
