name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify package data is included in wheel
        run: |
          wheel=$(ls dist/*.whl)
          python -m zipfile -l "$wheel" | grep -q "smoke_bench/tui/styles.tcss" || {
            echo "ERROR: styles.tcss missing from wheel" >&2; exit 1
          }
          count=$(python -m zipfile -l "$wheel" | grep -c "smoke_bench/benchmarks/datasets/.*\.jsonl")
          echo "Found $count dataset files in wheel"
          [ "$count" -ge 1 ] || { echo "ERROR: datasets missing from wheel" >&2; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          section=$(awk -v v="## [$version]" '
            index($0, v) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -n "$section" ]; then
            printf '%s' "$section" > notes.md
          else
            echo "No CHANGELOG.md section found for [$version]; using generated notes" >&2
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: notes.md
          VERSION: ${{ github.ref_name }}
        run: |
          args=(--title "$VERSION")
          if [ -f "$NOTES_FILE" ]; then
            args+=(--notes-file "$NOTES_FILE")
          else
            args+=(--generate-notes)
          fi
          gh release create "$VERSION" dist/* "${args[@]}"

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/smokebench

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
